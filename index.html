<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schooly</title><meta name="description" content="Schooly secure school workspace"><link rel="icon" href="schooly-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<style>
:root{--bg:#eef2f7;--panel:#eef2f7;--ink:#172033;--muted:#68758a;--blue:#356ae6;--blue2:#244fc0;--green:#2a9d62;--red:#d9485f;--amber:#c78218;--line:#d9e0ea;--shadow:10px 10px 24px rgba(170,182,199,.55),-8px -8px 20px rgba(255,255,255,.96);--inset:inset 4px 4px 10px rgba(180,190,205,.38),inset -4px -4px 10px rgba(255,255,255,.95);--radius:22px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100dvh;display:grid;grid-template-columns:260px 1fr}.side{padding:22px 16px;position:sticky;top:0;height:100dvh}.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 22px}.brand img{width:48px;height:48px}.brand strong{font-family:"Plus Jakarta Sans";font-size:1.08rem}.brand small{display:block;color:var(--muted);margin-top:2px}.nav{display:grid;gap:9px}.nav button,.logout{width:100%;text-align:left;padding:13px 15px;border-radius:16px;background:transparent;color:var(--muted);font-weight:700}.nav button.active{background:var(--panel);color:var(--blue);box-shadow:var(--inset)}.nav button:hover{color:var(--ink)}.logout{margin-top:18px;background:var(--panel);box-shadow:var(--shadow);color:var(--red);text-align:center}.content{padding:22px 28px 32px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{font-size:.82rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.title{font-family:"Plus Jakarta Sans";font-size:clamp(1.7rem,2.7vw,2.45rem);margin:6px 0 0}.account{display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border-radius:14px;object-fit:cover;background:#e0e6ee;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}.soft{box-shadow:var(--inset)}.hero-card{min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.hero-card h2{font-family:"Plus Jakarta Sans";font-size:1.75rem;margin:8px 0}.hero-card p{color:var(--muted);max-width:620px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}.stat b{font-size:1.65rem;display:block;margin-top:9px}.stat span{color:var(--muted);font-size:.9rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{padding:10px 13px;border-radius:13px;background:var(--panel);box-shadow:var(--shadow);color:var(--muted);font-weight:700}.tabs button.active{color:var(--blue);box-shadow:var(--inset)}.section{margin-top:18px}.section h3{margin:0 0 12px;font-family:"Plus Jakarta Sans"}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar input{max-width:330px}.table-wrap{overflow:auto;border-radius:18px;box-shadow:var(--inset)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}td{font-size:.94rem}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.78rem;font-weight:800;background:#e4ebf7;color:var(--muted)}.badge.green{color:var(--green);background:#e4f4ec}.badge.red{color:var(--red);background:#f9e5e9}.badge.amber{color:var(--amber);background:#fbf0da}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:.78rem;color:var(--muted);font-weight:700;margin:0 0 7px}.field input,.field select,.field textarea,.login input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--ink);box-shadow:var(--inset);outline:none}.field textarea{min-height:110px;resize:vertical}.btn{padding:12px 16px;border-radius:15px;background:var(--blue);color:white;font-weight:800;box-shadow:8px 8px 16px rgba(53,106,230,.18),-4px -4px 10px rgba(255,255,255,.75)}.btn.secondary{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}.btn.danger{background:var(--red)}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap}.notice{padding:14px 16px;border-radius:16px;background:#e8eef8;color:var(--muted);font-weight:600}.empty{padding:34px;text-align:center;color:var(--muted)}.login-shell{min-height:100dvh;display:grid;place-items:center;padding:20px}.login-card{width:min(480px,100%);padding:30px}.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.login-brand img{width:70px;height:70px}.login-brand h1{font-family:"Plus Jakarta Sans";margin:0}.login-brand p{margin:4px 0 0;color:var(--muted)}.login{display:grid;gap:14px}.error{color:var(--red);font-weight:700}.loading{position:fixed;inset:0;background:rgba(238,242,247,.86);display:grid;place-items:center;z-index:99}.loader{width:52px;height:52px;border-radius:50%;box-shadow:var(--inset);display:grid;place-items:center}.loader:before{content:"";width:24px;height:24px;border:3px solid #c9d2df;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.footer{margin-top:30px;text-align:center;color:var(--muted);font-size:.8rem}.footer a{color:var(--blue);font-weight:800;text-decoration:none}.mobile-menu{display:none}.profile-grid{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start}.profile-photo{width:150px;height:150px;border-radius:28px;object-fit:cover;box-shadow:var(--shadow)}.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.kv div{padding:14px;border-radius:16px;box-shadow:var(--inset)}.kv small{display:block;color:var(--muted);margin-bottom:4px}.toast{position:fixed;right:22px;bottom:22px;background:#182234;color:#fff;padding:13px 16px;border-radius:16px;box-shadow:var(--shadow);z-index:100;max-width:360px}.toast.ok{background:#195c3b}.toast.bad{background:#7b2636}@media(max-width:980px){.app{grid-template-columns:1fr}.side{height:auto;position:sticky;top:0;z-index:30;padding:10px 12px;background:var(--bg)}.brand{padding:7px 4px 11px}.brand img{width:40px;height:40px}.nav{display:flex;overflow:auto;padding-bottom:4px}.nav button{width:auto;white-space:nowrap;padding:10px 12px}.logout{margin:4px 0 0;display:none}.content{padding:16px}.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.mobile-menu{display:block}.form-grid{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}@media(max-width:520px){.content{padding:12px}.card{padding:16px;border-radius:18px}.stats{gap:10px}.stat b{font-size:1.3rem}.top{align-items:flex-start}.account div{display:none}.title{font-size:1.55rem}}
</style>
</head>
<body>
<div id="loading" class="loading"><div class="loader"></div></div>
<div id="loginView" class="login-shell hidden"><div class="card login-card"><div class="login-brand"><img src="schooly-icon.svg"><div><h1>Schooly</h1><p>Secure workspace</p></div></div><form id="loginForm" class="login"><div class="field"><label>Account ID</label><input id="loginId" autocomplete="username" required maxlength="32"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required maxlength="128"></div><button class="btn" type="submit">Sign in</button><div id="loginError" class="error hidden"></div></form><div class="footer">Made by <a href="https://raazimtech.github.io/Raazim-tech/" target="_blank" rel="noopener">Raazim Tech</a></div></div></div>
<div id="appView" class="app hidden"><aside class="side"><div class="brand"><img src="schooly-icon.svg"><div><strong>Schooly</strong><small>Workspace</small></div></div><nav class="nav" id="nav"></nav><button id="logout" class="logout">Sign out</button></aside><main class="content"><div class="top"><div><div class="eyebrow">Schooly</div><div class="title" id="pageTitle">Overview</div></div><div class="account"><img id="accountPhoto" class="avatar" src="schooly-icon.svg"><div><b id="accountName">Account</b><div id="accountRole" class="muted"></div></div></div></div><div id="page"></div><div class="footer">Made by <a href="https://raazimtech.github.io/Raazim-tech/" target="_blank" rel="noopener">Raazim Tech</a></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const {createClient}=supabase;
const SB_URL='https://dpiwdhtbhwjgatvcfkcb.supabase.co';
const SB_KEY='sb_publishable_PSZnTEo74jObih_6TTpXVQ_tJwzTnXY';
const db=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let me=null,role=null,current='home';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(msg,ok=true){const t=$('#toast');t.textContent=msg;t.className='toast '+(ok?'ok':'bad');setTimeout(()=>t.className='toast hidden',2800)}
function email(id){return `${String(id).trim().toLowerCase()}@schooly.local`}
async function signIn(e){e.preventDefault();$('#loginError').classList.add('hidden');const {error}=await db.auth.signInWithPassword({email:email($('#loginId').value),password:$('#loginPass').value});if(error){$('#loginError').textContent='Unable to sign in with those credentials.';$('#loginError').classList.remove('hidden');return}await boot()}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){$('#loading').classList.add('hidden');$('#loginView').classList.remove('hidden');return}const {data:p,error}=await db.from('schooly_profiles').select('*').eq('id',session.user.id).maybeSingle();if(error||!p||!p.active||p.role==='admin'){await db.auth.signOut();$('#loading').classList.add('hidden');$('#loginView').classList.remove('hidden');toast('This account is not available in this workspace.',false);return}me=p;role=p.role;$('#accountName').textContent=p.full_name;$('#accountRole').textContent=role[0].toUpperCase()+role.slice(1);if(p.photo_url)$('#accountPhoto').src=p.photo_url;buildNav();$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#loading').classList.add('hidden');render()}
function buildNav(){const items=role==='teacher'?[['home','Overview'],['attendance','Attendance'],['students','Students'],['announcements','Notices'],['profile','My account']]:[['home','Overview'],['attendance','Attendance'],['fees','Fees'],['announcements','Notices'],['profile','My account']];$('#nav').innerHTML=items.map(([k,l])=>`<button data-nav="${k}" class="${current===k?'active':''}">${l}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{current=b.dataset.nav;buildNav();render()})}
async function render(){const p=$('#page');$('#pageTitle').textContent=current==='home'?'Overview':document.querySelector(`[data-nav="${current}"]`)?.textContent||'Schooly';p.innerHTML='<div class="card empty">Loading…</div>';if(current==='home')return home();if(current==='attendance')return attendance();if(current==='students')return students();if(current==='fees')return fees();if(current==='announcements')return announcements();if(current==='profile')return profile()}
async function home(){const [students,att,ann,fees]=await Promise.all([db.from('schooly_students').select('id',{count:'exact',head:true}),db.from('schooly_attendance').select('id',{count:'exact',head:true}).eq('attendance_date',new Date().toISOString().slice(0,10)),db.from('schooly_announcements').select('id',{count:'exact',head:true}).eq('published',true),role==='student'&&me.id?db.from('schooly_fees').select('amount,paid_amount').eq('student_id',me.id):Promise.resolve({count:0,data:[]})]);const cards=role==='teacher'?[[students.count??0,'Students'],[att.count??0,"Today's attendance"],[ann.count??0,'Active notices'],[me.class_id?'Assigned':'Open','Class']]:[[1,'Your profile'],[att.count??0,'Attendance records today'],[ann.count??0,'Active notices'],[(fees.data||[]).reduce((a,x)=>a+Number(x.amount)-Number(x.paid_amount),0).toFixed(2),'Balance']];$('#page').innerHTML=`<div class="hero"><div class="card hero-card"><div><div class="eyebrow">Welcome back</div><h2>${esc(me.full_name)}</h2><p>Your Schooly workspace is connected and ready. Use the navigation to access the tools available to your account.</p></div><div class="badge">Secure session</div></div><div class="card soft"><div class="eyebrow">Today</div><h3 style="margin:9px 0 5px">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</h3><span class="muted">Keep records current and accurate.</span></div></div><div class="stats">${cards.map(x=>`<div class="card stat"><span>${x[1]}</span><b>${esc(x[0])}</b></div>`).join('')}</div><div class="section card"><h3>Latest notices</h3><div id="homeNotices" class="grid"></div></div>`;const {data}=await db.from('schooly_announcements').select('*').eq('published',true).order('created_at',{ascending:false}).limit(3);$('#homeNotices').innerHTML=data?.length?data.map(a=>`<div class="notice"><b>${esc(a.title)}</b><div style="margin-top:3px">${esc(a.body)}</div></div>`).join(''):'<div class="empty">No notices published yet.</div>'}
async function students(){const {data,error}=await db.from('schooly_students').select('id,admission_no,profile_id,guardian_name,guardian_phone,class_id,fee_status,schooly_profiles:profile_id(full_name,phone,photo_url)').order('admission_no');if(error){$('#page').innerHTML='<div class="card error">Unable to load records.</div>';return}$('#page').innerHTML=`<div class="card"><div class="toolbar"><h3>Students</h3><input id="studentSearch" placeholder="Search students…"></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Admission</th><th>Class</th><th>Guardian</th><th>Fees</th></tr></thead><tbody>${data?.map(s=>`<tr><td><b>${esc(s.schooly_profiles?.full_name)}</b></td><td>${esc(s.admission_no)}</td><td>${esc(s.class_id||'—')}</td><td>${esc(s.guardian_name||'—')}</td><td><span class="badge ${s.fee_status==='paid'?'green':s.fee_status==='partial'?'amber':'red'}">${esc(s.fee_status)}</span></td></tr>`).join('')||''}</tbody></table></div></div>`;$('#studentSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}}
async function attendance(){const today=new Date().toISOString().slice(0,10);const {data:classes}=await db.from('schooly_classes').select('*').eq('active',true).order('name');if(role==='teacher'){const {data:students}=await db.from('schooly_students').select('id,admission_no,profile_id,class_id,schooly_profiles:profile_id(full_name)').order('admission_no');$('#page').innerHTML=`<div class="card"><div class="toolbar"><div><h3>Attendance</h3><div class="muted">Record today's student attendance.</div></div><input id="attDate" type="date" value="${today}"></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Class</th><th>Status</th></tr></thead><tbody>${students?.map(s=>`<tr><td><b>${esc(s.schooly_profiles?.full_name)}</b><div class="muted">${esc(s.admission_no)}</div></td><td>${esc(s.class_id||'—')}</td><td><select class="att" data-id="${s.id}" data-class="${s.class_id||''}"><option value="present">Present</option><option value="absent">Absent</option><option value="late">Late</option><option value="excused">Excused</option></select></td></tr>`).join('')||''}</tbody></table></div><div class="actions" style="margin-top:14px"><button class="btn" id="saveAtt">Save attendance</button></div></div>`;const loadExisting=async()=>{const d=$('#attDate').value;const {data}=await db.from('schooly_attendance').select('student_id,status').eq('attendance_date',d);(data||[]).forEach(a=>{const s=document.querySelector(`.att[data-id="${a.student_id}"]`);if(s)s.value=a.status})};$('#attDate').onchange=loadExisting;await loadExisting();$('#saveAtt').onclick=async()=>{const date=$('#attDate').value;const rows=[...document.querySelectorAll('.att')].map(x=>({student_id:x.dataset.id,class_id:x.dataset.class||null,attendance_date:date,status:x.value,marked_by:me.id}));const {error}=await db.from('schooly_attendance').upsert(rows,{onConflict:'student_id,attendance_date'});toast(error?error.message:'Attendance saved.',!error);if(!error)render()};return}
const {data}=await db.from('schooly_attendance').select('attendance_date,status,note,schooly_students:student_id(admission_no),schooly_profiles:marked_by(full_name)').eq('student_id',me.id).order('attendance_date',{ascending:false}).limit(60);$('#page').innerHTML=`<div class="card"><h3>Attendance history</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Status</th><th>Marked by</th><th>Note</th></tr></thead><tbody>${data?.map(a=>`<tr><td>${esc(a.attendance_date)}</td><td><span class="badge ${a.status==='present'?'green':a.status==='absent'?'red':'amber'}">${esc(a.status)}</span></td><td>${esc(a.schooly_profiles?.full_name||'—')}</td><td>${esc(a.note||'—')}</td></tr>`).join('')||''}</tbody></table></div></div>`}
async function fees(){const {data}=await db.from('schooly_fees').select('*').eq('student_id',me.id).order('due_date',{ascending:false});const total=(data||[]).reduce((a,x)=>a+Number(x.amount)-Number(x.paid_amount),0);$('#page').innerHTML=`<div class="stats"><div class="card stat"><span>Outstanding</span><b>${total.toFixed(2)}</b></div><div class="card stat"><span>Entries</span><b>${data?.length||0}</b></div></div><div class="card section"><h3>Fee records</h3><div class="table-wrap"><table><thead><tr><th>Due</th><th>Amount</th><th>Paid</th><th>Status</th><th>Note</th></tr></thead><tbody>${data?.map(f=>`<tr><td>${esc(f.due_date||'—')}</td><td>${esc(f.amount)}</td><td>${esc(f.paid_amount)}</td><td><span class="badge ${f.status==='paid'?'green':f.status==='partial'?'amber':'red'}">${esc(f.status)}</span></td><td>${esc(f.note||'—')}</td></tr>`).join('')||''}</tbody></table></div></div>`}
async function announcements(){const {data}=await db.from('schooly_announcements').select('*').eq('published',true).order('created_at',{ascending:false});$('#page').innerHTML=`<div class="grid">${data?.map(a=>`<article class="card"><div class="eyebrow">${new Date(a.created_at).toLocaleDateString()}</div><h3 style="margin:7px 0">${esc(a.title)}</h3><p class="muted" style="white-space:pre-wrap">${esc(a.body)}</p></article>`).join('')||'<div class="card empty">No notices.</div>'}</div>`}
async function profile(){const kind=role==='teacher'?'schooly_teachers':'schooly_students';const {data}=await db.from(kind).select('*').eq('profile_id',me.id).maybeSingle();const cls=me.class_id?await db.from('schooly_classes').select('name,section').eq('id',me.class_id).maybeSingle():{data:null};$('#page').innerHTML=`<div class="card"><div class="profile-grid"><img class="profile-photo" src="${esc(me.photo_url||'schooly-icon.svg')}"><div><h3>${esc(me.full_name)}</h3><div class="badge">${esc(role)}</div><div class="kv" style="margin-top:15px"><div><small>Account ID</small><b>${esc(me.account_id)}</b></div><div><small>Phone</small><b>${esc(me.phone||'—')}</b></div><div><small>Class</small><b>${esc(cls.data?cls.data.name+(cls.data.section?' · '+cls.data.section:''):(me.class_id||'—'))}</b></div><div><small>Reference</small><b>${esc(role==='teacher'?(data?.employee_no||'—'):(data?.admission_no||'—'))}</b></div></div></div></div></div>`}
$('#loginForm').addEventListener('submit',signIn);$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'&&me){location.reload()}});boot();
</script>
</body></html>
